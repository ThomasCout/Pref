# Publie la nouvelle appli React (dossier react/) sur GitHub Pages.
# Déclenchement manuel pour l'instant : l'ancienne appli reste en ligne tant que
# Settings > Pages > Source n'est pas réglé sur « GitHub Actions ».
# À la bascule, on ajoutera un déclencheur « push sur main » (voir README de la migration).
name: Publier L'apPréfet (React)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
