# Publie la nouvelle appli React (dossier react/) sur GitHub Pages.
# Prérequis : Settings > Pages > Source = « GitHub Actions ».
# Retour arrière : remettre Source = « Deploy from a branch » (main, /root) : l'ancienne appli (index.html à la racine) reste dans le dépôt.
name: Publier L'apPréfet (React)

on:
  push:
    branches: [main]
    paths: ['react/**', '.github/workflows/pages-react.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
