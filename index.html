<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F7">
<title>Préfectures de France — Carnet de visites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#F3F4F7; --card:#FFFFFF; --ink:#0E1726; --ink2:#54607A; --line:#E3E6EE;
  --accent:#1B3FD6; --soft:#E8ECFB; --light:#98A9ED; --chip:#EEF0F5; --navy:#0E1726; --danger:#B42318;
  --navh:68px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#DDE1EA;color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
@supports (height:100dvh){html,body{height:100dvh}}
body{display:flex;align-items:center;justify-content:center}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.hidden{display:none!important}
.mut{color:var(--ink2);font-size:13px;line-height:1.55}

/* ---------- cadre de l'application : prend tout l'écran, jamais de scroll parasite ---------- */
#app{position:relative;width:100%;max-width:480px;height:100%;background:var(--bg);overflow:hidden}
@media (min-width:521px){
  #app{height:min(100%,900px);border-radius:28px;box-shadow:0 24px 60px rgba(14,23,38,.18)}
}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}

/* ---------- couverture ---------- */
#cover{background:var(--navy);color:#fff;justify-content:space-between;
  padding:calc(var(--sat) + 36px) 24px calc(var(--sab) + 28px);cursor:pointer}
#cover .brand{font-size:13px;font-weight:500;color:#9FB0D3}
#cover h1{margin-top:6px;font:700 34px/1.1 'Space Grotesk',sans-serif;letter-spacing:-.02em}
.cv-mid{display:flex;flex-direction:column;align-items:center;gap:22px}
.cv-ring{position:relative;width:200px;height:200px}
.cv-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cv-center b{font:700 56px/1 'Space Grotesk',sans-serif}
.cv-center span{margin-top:6px;font-size:13px;color:#B8C4DE}
#cv-g{padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.12);font:700 16px 'Space Grotesk',sans-serif}
.cv-foot{text-align:center;font-size:12px;color:#9FB0D3;margin-top:14px}

/* ---------- en-tête, vue, navigation ---------- */
#main{padding:0}
header{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  padding:calc(var(--sat) + 20px) 20px 0}
.brand{font-size:13px;font-weight:500;color:var(--ink2)}
header h1{margin-top:2px;font:700 30px/1.1 'Space Grotesk',sans-serif;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:14px;
  border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600}
#view{flex:1;min-height:0;position:relative;isolation:isolate;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding:16px 20px 28px}
nav{flex:none;display:flex;gap:4px;height:var(--navh);margin:8px 16px calc(16px + var(--sab));padding:6px;
  background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 8px 24px rgba(14,23,38,.08)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:0;border-radius:18px;background:transparent;color:var(--ink2);font-size:11px;font-weight:500}
nav button.on{background:var(--soft);color:var(--accent);font-weight:600}
.fab{position:absolute;right:24px;bottom:calc(var(--navh) + 32px + var(--sab));width:56px;height:56px;z-index:5;
  display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:var(--accent);color:#fff;
  box-shadow:0 8px 20px rgba(14,23,38,.25)}

/* ---------- composants ---------- */
.hero{display:flex;align-items:center;gap:16px;padding:16px;border-radius:20px;background:var(--navy);color:#fff}
.hero-ring{position:relative;width:76px;height:76px;flex:0 0 76px}
.hero-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 18px 'Space Grotesk',sans-serif}
.hero-txt{flex:1;min-width:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#9FB0D3}
.hero-g{margin-top:2px;font:700 19px/1.2 'Space Grotesk',sans-serif}
.hero p{margin-top:7px;font-size:13px;color:#B8C4DE}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.hero .bar{background:rgba(255,255,255,.14)} .hero .bar i{background:var(--light)}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;margin-top:14px;background:#fff;
  border:1px solid var(--line);border-radius:14px;color:var(--ink2)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:var(--ink)}
.seg{display:flex;gap:4px;padding:4px;margin-top:12px;background:#E6E9F0;border-radius:14px}
.seg button{flex:1;height:40px;border:0;border-radius:10px;background:transparent;color:var(--ink2);font-size:14px;font-weight:500}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(14,23,38,.12)}
.listhead{display:flex;justify-content:space-between;margin:16px 2px 8px;font-size:12px;color:var(--ink2)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 8px;font-size:12px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.fiche{display:flex;align-items:center;gap:12px;width:100%;padding:12px;margin-bottom:10px;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:16px}
.fiche:active{background:#F8F9FB}
.badge{flex:0 0 44px;width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font:700 15px 'Space Grotesk',sans-serif;overflow:hidden}
.badge.todo{background:var(--chip);color:var(--ink2)}
.badge img{width:100%;height:100%;object-fit:cover}
.ft{flex:1;min-width:0}
.ft h3{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft p{margin-top:2px;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--chip);
  color:var(--ink2);font-size:12px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--soft);color:var(--accent)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi{padding:14px;background:#fff;border:1px solid var(--line);border-radius:16px}
.kpi b{display:block;font:700 28px/1 'Space Grotesk',sans-serif}
.kpi span{display:block;margin-top:6px;font-size:12px;color:var(--ink2)}
.line{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.line:last-child{border-bottom:0}
.empty{text-align:center;padding:22px 16px;margin-top:14px}
.empty b{display:block;font:700 18px 'Space Grotesk',sans-serif}
.empty p{margin:6px 0 14px}
.field{width:100%;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;font-size:16px;outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
textarea.field{resize:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:0 18px;border:0;
  border-radius:14px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;text-decoration:none;text-align:center}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:#fff;color:var(--danger);border:1px solid #F1C7C3}
.btn.light{background:#fff;color:var(--ink)}
.btn[disabled]{background:var(--chip);color:#7B859C;cursor:not-allowed}
.btn+.btn{margin-top:8px}
.sug{margin-top:6px;max-height:230px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
.sug button{display:block;width:100%;padding:10px 14px;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:15px}
.sug button:last-child{border-bottom:0}
.sug button small{display:block;margin-top:1px;color:var(--ink2);font-size:12px}
.sug button.seen{opacity:.6}
.sug .none{padding:12px 14px;font-size:13px;color:var(--ink2)}

/* ---------- détail ---------- */
.dhead h2{font:700 26px/1.15 'Space Grotesk',sans-serif;letter-spacing:-.01em}
.dhead p{margin-top:4px}
.dstat{display:flex;align-items:center;gap:12px;margin:16px 0}
.dstat .ic{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--accent)}
.dstat.todo .ic{background:var(--chip);color:var(--ink2)}
.dstat b{display:block;font-size:16px}
.dphoto{width:100%;border-radius:18px;display:block;margin:0 0 4px;max-height:340px;object-fit:cover}
.note{font-size:15px;line-height:1.55;font-style:italic}

/* ---------- carte ---------- */
#view.map-mode{padding:0;overflow:hidden;margin-top:12px;border-radius:24px 24px 0 0}
#map{position:absolute;inset:0;background:#E4E9F1;font-family:inherit}
.map-fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center}
.map-top{position:absolute;top:10px;left:0;right:0;z-index:1100;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.mchips{display:flex;gap:8px;padding:0 12px;overflow-x:auto;scrollbar-width:none;pointer-events:auto}
.mchips::-webkit-scrollbar{display:none}
.mchips button{flex:0 0 auto;height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;
  font-size:14px;font-weight:500;box-shadow:0 4px 12px rgba(14,23,38,.10)}
.mchips button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.mchips.sm button{height:36px;padding:0 13px;font-size:13px}
.map-zoom{position:absolute;right:12px;top:118px;z-index:1100;display:flex;flex-direction:column;background:#fff;
  border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 16px rgba(14,23,38,.10);overflow:hidden}
.map-zoom button{width:44px;height:44px;border:0;background:transparent;font-size:22px;line-height:1}
.map-zoom button+button{border-top:1px solid var(--line)}
.map-panel{position:absolute;left:12px;right:12px;bottom:28px;z-index:1100;padding:10px;background:#fff;
  border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 28px rgba(14,23,38,.14)}
.map-panel .fiche{margin:0;border:0;padding:4px}
.hint{padding:8px 6px;font-size:14px;color:var(--ink2)}
.legend{display:flex;gap:16px;padding:8px 6px 2px;font-size:12px;font-weight:500}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid #6B7691}
.legend i.on{background:var(--accent);border-color:var(--accent)}
.leaflet-container{font-family:inherit}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.85)!important}

/* ---------- fiche de visite (feuille) ---------- */
#modal{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg)}
#modal .mbody{flex:1;min-height:0;overflow-y:auto;padding:4px 20px 20px}
#modal .mfoot{flex:none;padding:12px 20px calc(12px + var(--sab));background:#fff;border-top:1px solid var(--line)}
#hit{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(243,244,247,.8);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.done{display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .35s cubic-bezier(.2,.9,.3,1.2) both}
.done .ic{display:flex;align-items:center;justify-content:center;width:84px;height:84px;border-radius:50%;background:var(--accent);color:#fff}
.done b{margin-top:10px;font:700 22px 'Space Grotesk',sans-serif}
.done span.s{font-size:14px;color:var(--ink2)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#promo{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:32px;text-align:center;background:var(--navy);color:#fff}
#promo .brand{color:#9FB0D3}
#promo .g{font:700 28px/1.15 'Space Grotesk',sans-serif}
#promo .mut{color:#B8C4DE}
#promo .ic{display:flex;align-items:center;justify-content:center;width:84px;height:84px;border-radius:50%;background:var(--light);color:var(--navy);
  animation:pop .4s cubic-bezier(.2,.9,.3,1.2) both}
@media (prefers-reduced-motion:reduce){.done,#promo .ic{animation:none}}
</style>
</head>
<body>
<div id="app">

  <!-- COUVERTURE -->
  <div class="screen" id="cover" role="button" tabindex="0" aria-label="Ouvrir mon carnet">
    <div>
      <div class="brand">Préfectures de France</div>
      <h1>Mon carnet de visites</h1>
    </div>
    <div class="cv-mid">
      <div class="cv-ring">
        <div id="cv-ring"></div>
        <div class="cv-center"><b id="cv-n">0</b><span id="cv-t"></span></div>
      </div>
      <div id="cv-g"></div>
    </div>
    <div>
      <button class="btn light" id="cv-open" type="button">Ouvrir mon carnet</button>
      <div class="cv-foot">Application non officielle · v0.2</div>
    </div>
  </div>

  <!-- APPLICATION -->
  <div class="screen hidden" id="main">
    <header>
      <div>
        <div class="brand" id="h-brand">Préfectures de France</div>
        <h1 id="h-title">Registre</h1>
      </div>
      <button class="pill" id="h-act" type="button" hidden></button>
    </header>
    <div id="view"></div>
    <button class="fab" id="fab" type="button" aria-label="Déclarer une visite">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <nav aria-label="Navigation principale">
      <button type="button" data-tab="registre" class="on">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Registre</button>
      <button type="button" data-tab="carte">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Carte</button>
      <button type="button" data-tab="dossier">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6.5 16c.5-1.5 4.5-1.5 5 0M14 10h4M14 14h4"/></svg>Dossier</button>
      <button type="button" data-tab="reglages">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Réglages</button>
    </nav>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

function ring(pct, size, stroke, track, color){
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(1, pct)));
  const h = size / 2;
  return '<svg aria-hidden="true" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" style="transform:rotate(-90deg)">' +
    '<circle cx="' + h + '" cy="' + h + '" r="' + r.toFixed(1) + '" fill="none" stroke="' + track + '" stroke-width="' + stroke + '"/>' +
    '<circle cx="' + h + '" cy="' + h + '" r="' + r.toFixed(1) + '" fill="none" stroke="' + color + '" stroke-width="' + stroke +
    '" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/></svg>';
}

function seed(){
  let s = 42; const r = () => (s = (s*1103515245+12345) & 0x7fffffff) / 0x7fffffff;
  const notes = ["Belle façade XVIIIe, guichet fermé le lundi.","Petit marché sur la place juste devant.",
    "Bâtiment en travaux, grue dans la cour.","Drapeau en berne ce jour-là.","Escalier d'honneur magnifique.",
    "Fermée pour cause de pont. Revenir.","Un chat dormait sur le perron.",""];
  const out = {}; let n = 0;
  const pool = PLACES.slice().sort(() => r() - .5);
  for (const p of pool) { if (n >= 47) break;
    const d = new Date(2025, 0, 1 + Math.floor(r()*600));
    if (d > new Date()) continue;
    out[p.id] = { date: isoOf(d), note: notes[Math.floor(r()*notes.length)], photo: null, demo: true };
    n++;
  }
  return out;
}

function filtered(){
  let L = PLACES.filter(keep);
  if (state.q) { const q = norm(state.q); L = L.filter(p => p.recherche.includes(q) || norm(p.deptNom).includes(q) || p.dept === q); }
  if (state.sort === 'alpha') L.sort((a,b) => a.nom.localeCompare(b.nom,'fr'));
  else if (state.sort === 'dept') L.sort((a,b) => a.dept.padStart(3,'0').localeCompare(b.dept.padStart(3,'0')) || a.nom.localeCompare(b.nom,'fr'));
  else L.sort((a,b) => { const x = visits[a.id], y = visits[b.id];
    if (x && y) return y.date.localeCompare(x.date); if (x) return -1; if (y) return 1;
    return a.nom.localeCompare(b.nom,'fr'); });
  return L;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') { const m = el('modal'); if (m) m.remove(); } });
function suggest(){
  const box = el('f-sug'), q = norm(draft.q);

  if (!q || draft.id) { box.classList.add('hidden'); return; }
  const L = PLACES.filter(p => p.recherche.includes(q)).sort((a,b) =>

function syncFiche(){

function shrink(file){
  if (!file) return;
  const img = new Image(), rd = new FileReader();
  rd.onerror = img.onerror = () => alert("Impossible de lire cette image.");
  rd.onload = () => { img.onload = () => {
    const max = 1000, s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    draft.photo = c.toDataURL('image/jpeg', .7); if (el('modal')) syncFiche();
  }; img.src = rd.result; };
  rd.readAsDataURL(file);
}
function submit(){
  if (!draft.id || !draft.date) return;
  const id = draft.id, date = draft.date, before = gradeOf(count()), prev = visits[id];
  visits[id] = { date, note: draft.note.trim(), photo: draft.photo, updatedAt: Date.now() };
  if (!persist()) {
    /* quota atteint : on retente sans la photo plutôt que de perdre la visite */
    if (visits[id].photo) {
      visits[id].photo = null;
      if (persist()) alert("Espace de stockage insuffisant : la visite est enregistrée sans la photo.");
      else { if (prev) visits[id] = prev; else delete visits[id]; alert("Enregistrement impossible : le stockage du navigateur est plein ou inaccessible."); return; }
    } else { if (prev) visits[id] = prev; else delete visits[id]; alert("Enregistrement impossible : le stockage du navigateur est plein ou inaccessible."); return; }
  }
  track(id, false);
  const after = gradeOf(count());
  if (navigator.vibrate) navigator.vibrate(35);
  const hit = document.createElement('div'); hit.id = 'hit';
  hit.innerHTML = '<div class="done"><span class="ic">' + I.checkBig + '</span><b>Visite enregistrée</b><span class="s">' + longDate(date) + '</span></div>';

/* ----- carte (Leaflet + tuiles OpenStreetMap) ----- */
let map = null, layer = null, markers = {};
function destroyMap(){ if (map) { map.remove(); map = null; layer = null; markers = {}; } }
function pinStyle(p, sel){
  if (sel) return { radius:11, color:INK, weight:3, fillColor:ACC, fillOpacity:1 };
  return visits[p.id]
    ? { radius:7, color:'#fff', weight:2, fillColor:ACC, fillOpacity:1 }
    : { radius:5, color:MUTED, weight:2, fillColor:'#fff', fillOpacity:1 };
}
function domGroups(){
  const m = {};
  PLACES.forEach(p => { if (p.dept.length === 3) (m[p.dept] = m[p.dept] || { name:p.deptNom, pts:[] }).pts.push([p.lat, p.lng]); });
  return m;
}
function fitMetro(){ map.fitBounds(METRO, { paddingTopLeft:[8,118], paddingBottomRight:[8,150], maxZoom:7 }); }
function updateMarkers(){
  if (!map) return;
  layer.clearLayers(); markers = {};
  if (state.pin && !keep(BY_ID[state.pin])) state.pin = null;
  const shown = PLACES.filter(keep).sort((a,b) => (visits[a.id] ? 1 : 0) - (visits[b.id] ? 1 : 0));
  for (const p of shown) {
    const m = L.circleMarker([p.lat, p.lng], pinStyle(p, p.id === state.pin));
    m.on('click', () => selectPin(p.id));
    m.addTo(layer); markers[p.id] = m;
  }
  if (state.pin && markers[state.pin]) markers[state.pin].bringToFront();
  renderPanel();
}
function selectPin(id){
  const prev = state.pin && markers[state.pin];
  if (prev) prev.setStyle(pinStyle(BY_ID[state.pin], false));
  state.pin = id;
  const m = markers[id]; if (m) { m.setStyle(pinStyle(BY_ID[id], true)); m.bringToFront(); }
  renderPanel();
}
function renderPanel(){
  const box = el('m-panel'); if (!box) return;
  const p = state.pin && BY_ID[state.pin];
  box.innerHTML = (p ? ficheHTML(p) : '<div class="hint">Touchez un repère pour ouvrir sa fiche.</div>') +
    '<div class="legend"><span><i class="on"></i>Visitée</span><span><i></i>À voir</span></div>';
  const f = box.querySelector('.fiche');
  if (f) f.onclick = () => visits[p.id] ? viewDetail(p.id) : openFiche(p.id);
}
function viewCarte(){
  const v = setView(true), doms = domGroups();
  v.innerHTML = '<div id="map"></div>' +
    '<div class="map-top">' +
      '<div class="mchips" id="m-filters">' + [['all','Toutes'],['seen','Vues'],['todo','Restantes']].map(x =>
        '<button type="button" data-f="' + x[0] + '" class="' + (state.filter === x[0] ? 'on' : '') + '">' + x[1] + '</button>').join('') + '</div>' +
      '<div class="mchips sm" id="m-terr"><button type="button" data-t="fr">France</button>' +
        Object.keys(doms).sort().map(k => '<button type="button" data-t="' + esc(k) + '">' + esc(doms[k].name) + '</button>').join('') + '</div>' +
    '</div>' +
    '<div class="map-zoom"><button type="button" id="z-in" aria-label="Zoom avant">+</button><button type="button" id="z-out" aria-label="Zoom arrière">−</button></div>' +
    '<div class="map-panel" id="m-panel"></div>';
  renderPanel();
  if (typeof L === 'undefined') {
    el('map').innerHTML = '<div class="map-fail"><p class="mut">La carte n\'a pas pu être chargée.<br>Vérifiez votre connexion puis rouvrez cet onglet.</p></div>';
    return;
  }
  map = L.map('map', { zoomControl:false, attributionControl:false, renderer:L.canvas({ tolerance:10 }), zoomSnap:.5, minZoom:3, maxZoom:18 });
  L.control.attribution({ prefix:false, position:'bottomright' }).addTo(map);
  L.tileLayer(TILE.url, { attribution:TILE.attr, maxZoom:19, subdomains:'abcd' }).addTo(map);
  layer = L.layerGroup().addTo(map);
  fitMetro();
  updateMarkers();
  if (state.pin) { const p = BY_ID[state.pin]; map.setView([p.lat, p.lng], 9); }
  requestAnimationFrame(() => { if (map) map.invalidateSize(); });
  el('z-in').onclick = () => map && map.zoomIn();
  el('z-out').onclick = () => map && map.zoomOut();
  v.querySelectorAll('#m-filters button').forEach(b => b.onclick = () => {
    state.filter = b.dataset.f;
    v.querySelectorAll('#m-filters button').forEach(x => x.classList.toggle('on', x === b));
    updateMarkers(); });
  v.querySelectorAll('#m-terr button').forEach(b => b.onclick = () => {
    if (!map) return;
    if (b.dataset.t === 'fr') fitMetro();
    else map.fitBounds(doms[b.dataset.t].pts, { padding:[40,40], maxZoom:11 }); });
}

/* ----- réglages : export / import réels ----- */
function exportCarnet(){
  const data = { app:'prefectures-carnet', version:1, exportedAt:new Date().toISOString(), visits };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type:'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = 'carnet-' + today() + '.carnet';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function cleanVisit(x){
  if (!x || typeof x !== 'object' || !/^\d{4}-\d{2}-\d{2}$/.test(x.date)) return null;
  /* data URL strictement validée : elle finit dans un attribut src, aucun guillemet ne doit passer */
  const photo = typeof x.photo === 'string' && x.photo.length <= 600000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(x.photo) ? x.photo : null;
  return { date:x.date, note:typeof x.note === 'string' ? x.note.slice(0,500) : '', photo, updatedAt:Date.now() };
}
function importCarnet(file){
  if (!file) return;
  const rd = new FileReader();
  rd.onerror = () => alert('Impossible de lire ce fichier.');
  rd.onload = () => {
    let data; try { data = JSON.parse(rd.result); } catch(e){ alert("Ce fichier n'est pas un carnet valide."); return; }
    const src = data && data.visits && typeof data.visits === 'object' ? data.visits : null;
    if (!src) { alert("Ce fichier n'est pas un carnet valide."); return; }
    const add = {};
    for (const id of Object.keys(src)) { const c = BY_ID[id] && cleanVisit(src[id]); if (c) add[id] = c; }
    const k = Object.keys(add).length;
    if (!k) { alert('Aucune visite exploitable dans ce fichier.'); return; }
    if (!confirm('Importer ' + k + ' visite' + (k > 1 ? 's' : '') + ' ? Les fiches déjà présentes seront remplacées par celles du fichier.')) return;
    const backup = visits; visits = Object.assign({}, visits, add);
    if (!persist()) { visits = backup; alert("Import impossible : espace de stockage insuffisant."); return; }
    Object.keys(add).forEach(id => track(id, false));
    renderCover(); render();
  };
  rd.readAsText(file);
}
function viewReglages(){
  const v = setView(false), n = count(), ph = Object.values(visits).filter(x => x.photo).length;
  v.innerHTML =
    '<div class="sec" style="margin-top:4px"><span>Synchronisation</span></div>' + syncCardHTML() +
    '<div class="sec"><span>Sauvegarde</span></div><div class="card">' +
    '<p class="mut" style="margin-bottom:12px">Archive <b>.carnet</b> contenant vos visites et leurs photos. ' + n + ' visite' + (n>1?'s':'') + ', ' + ph + ' photo' + (ph>1?'s':'') + '.</p>' +
    '<button type="button" class="btn alt" id="r-exp">Exporter le carnet</button>' +
    '<label class="btn alt" style="cursor:pointer">Importer un carnet<input type="file" id="r-imp" accept=".carnet,.json,application/json" hidden></label></div>' +
    '<div class="sec"><span>Référentiel</span></div><div class="card"><p class="mut">' + TOTAL + ' lieux embarqués : ' +
    PLACES.filter(p => p.type === 'prefecture').length + ' préfectures et ' + PLACES.filter(p => p.type === 'sous_pref').length +
    ' sous-préfectures, sur 102 départements. Source : annuaire de l\'administration, Etalab, licence ouverte.</p></div>' +
    '<div class="sec"><span>Données de démonstration</span></div><div class="card">' +
    '<p class="mut" style="margin-bottom:12px">Les visites affichées au premier lancement sont des données de démonstration. Les lieux, adresses et coordonnées sont authentiques.</p>' +
    '<button type="button" class="btn warn" id="r-reset">Vider le carnet</button>' +
    (session ? '' : '<button type="button" class="btn alt" id="r-seed">Recharger les visites de démonstration</button>') + '</div>' +
    '<div class="sec"><span>À propos</span></div><div class="card"><p class="mut">Préfectures de France, v0.2. Application non officielle, sans lien avec le ministère de l\'Intérieur. ' +
    'Vos données restent sur cet appareil, sauf si vous activez la synchronisation : elles sont alors stockées sur votre compte Supabase, visibles de vous seul. ' +
    'Les tuiles de la carte sont chargées depuis OpenStreetMap / CARTO.</p></div>';
  el('r-exp').onclick = exportCarnet;
  el('r-imp').onchange = e => { importCarnet(e.target.files[0]); e.target.value = ''; };
  el('r-reset').onclick = () => {
    if (!confirm('Vider entièrement le carnet ?' + (session ? ' Il sera aussi vidé sur votre compte.' : ''))) return;
    Object.keys(visits).forEach(id => { if (isReal(visits[id])) track(id, true); });
    visits = {}; persist(); renderCover(); render(); };
  const rs = el('r-seed');
  if (rs) rs.onclick = () => { if (confirm('Remplacer le carnet actuel par les visites de démonstration ?')) { visits = seed(); persist(); renderCover(); render(); } };
  const sn = el('s-now'); if (sn) sn.onclick = () => sync();
  const ss = el('s-send'); if (ss) ss.onclick = sendLink;
  const so = el('s-out'); if (so) so.onclick = signOut;
}

/* ----- synchronisation distante (Supabase) : local d'abord, dernier écrit gagne ----- */
const hhmm = iso => new Date(iso).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
function setStatus(t){ syncStatus = t; const s = el('sync-status'); if (s) s.textContent = t; }

/* Enregistre une modification locale à envoyer. Les suppressions ne sont suivies que connecté :
   hors connexion, un retrait local ne doit jamais effacer le compte à la prochaine connexion. */
function track(id, gone){
  if (!sb) return;
  const ts = Date.now();
  if (gone) { if (!session) return; deleted[id] = ts; } else delete deleted[id];
  dirty[id] = ts; saveMeta(); scheduleSync();
}
function scheduleSync(delay){
  if (!sb || !session) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(), delay == null ? 1500 : delay);
}
function bindUser(){
  const known = (() => { try { return localStorage.getItem('carnet.uid'); } catch(e){ return null; } })();
  if (known && known !== session.user.id) {          /* autre compte sur ce navigateur : on repart à zéro côté synchro */
    lastSync = null; dirty = {}; deleted = {};
    Object.values(visits).forEach(v => { delete v.updatedAt; });
    save('carnet.lastSync', null); saveMeta();
  }
  try { localStorage.setItem('carnet.uid', session.user.id); } catch(e){}
  /* un compte connecté n'affiche jamais les visites de démonstration */
  let purged = false;
  for (const id of Object.keys(visits)) if (visits[id].demo) { delete visits[id]; purged = true; }
  if (purged) { persist(); renderCover(); }
}
function refreshAfterSync(){
  if (el('main').classList.contains('hidden') || el('modal') || el('promo') || inDetail) return;
  if (state.tab === 'carte' && map) { updateMarkers(); return; }
  render();
}
async function sync(){
  if (!sb || !session) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; setStatus('Synchronisation…');
  let changed = 0;
  try {
    const uid = session.user.id;
    /* fiches enregistrées avant la synchro (sans horodatage) : on demande avant de les envoyer */
    if (!lastSync) {
      const legacy = Object.keys(visits).filter(id => !visits[id].demo && !visits[id].local && !visits[id].updatedAt);
      if (legacy.length) {
        const ok = confirm('Cet appareil contient ' + legacy.length + ' visite' + (legacy.length > 1 ? 's' : '') +
          ' enregistrée' + (legacy.length > 1 ? 's' : '') + ' avant la synchronisation. Les envoyer vers votre compte ?\n\n' +
          'Annuler : elles restent sur cet appareil, sans être envoyées.');
        legacy.forEach(id => { if (ok) { visits[id].updatedAt = 1; dirty[id] = Date.now(); } else visits[id].local = true; });
        persist(); saveMeta();
      }
    }
    /* 1. récupération des changements distants, par pages (filtre sur l'horloge serveur, marge de 5 min) */
    const since = lastSync ? new Date(new Date(lastSync).getTime() - 300000).toISOString() : null;
    let from = 0, maxTs = lastSync;
    for (;;) {
      let q = sb.from('visits').select('place_id,date,note,photo,deleted,client_ts,updated_at');
      if (since) q = q.gte('updated_at', since);
      const { data, error } = await q.order('updated_at', { ascending:true }).order('place_id', { ascending:true }).range(from, from + 24);
      if (error) throw error;
      for (const r of data) {
        if (!maxTs || r.updated_at > maxTs) maxTs = r.updated_at;
        const id = r.place_id, cur = visits[id], ts = Number(r.client_ts);
        if (!BY_ID[id] || !isFinite(ts)) continue;
        const localTs = cur ? (isReal(cur) ? (cur.updatedAt || 0) : 0) : (deleted[id] || 0);
        if (ts <= localTs) continue;                    /* la version locale est plus récente */
        if (r.deleted) { if (cur) delete visits[id]; deleted[id] = ts; }
        else { const c = cleanVisit({ date:r.date, note:r.note, photo:r.photo }); if (!c) continue; c.updatedAt = ts; visits[id] = c; delete deleted[id]; }
        delete dirty[id]; changed++;
      }
      if (data.length < 25) break;
      from += 25;
    }
    /* 2. envoi des modifications locales */
    const rows = [], snap = {};
    for (const id of Object.keys(dirty)) {
      const v = visits[id];
      if (isReal(v)) rows.push({ user_id:uid, place_id:id, date:v.date, note:v.note || '', photo:v.photo || null, deleted:false, client_ts:v.updatedAt || dirty[id] });
      else if (!v && deleted[id]) rows.push({ user_id:uid, place_id:id, date:null, note:'', photo:null, deleted:true, client_ts:deleted[id] });
      else { delete dirty[id]; continue; }
      snap[id] = dirty[id];
    }
    for (let i = 0; i < rows.length; i += 20) {
      const part = rows.slice(i, i + 20);
      const { error } = await sb.from('visits').upsert(part, { onConflict:'user_id,place_id' });
      if (error) throw error;
      part.forEach(r => { if (dirty[r.place_id] === snap[r.place_id]) delete dirty[r.place_id]; });
    }
    if (maxTs) { lastSync = maxTs; save('carnet.lastSync', lastSync); }
    persist(); saveMeta();
    lastOk = new Date().toISOString(); save('carnet.lastOk', lastOk);
    setStatus('Synchronisé à ' + hhmm(lastOk));
    if (changed) { renderCover(); refreshAfterSync(); }
  } catch (e) {
    persist(); saveMeta();
    setStatus('Échec de la synchronisation : ' + (e && e.message ? e.message : 'réseau indisponible') + '. Nouvel essai au prochain changement.');
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; scheduleSync(300); }
  }
}
async function sendLink(){
  const mail = (el('s-mail').value || '').trim();
  if (!/^\S+@\S+\.\S+$/.test(mail)) { setStatus('Adresse e-mail invalide.'); return; }
  if (location.protocol === 'file:') { setStatus("La connexion nécessite que l'app soit servie en https (par exemple GitHub Pages)."); return; }
  const b = el('s-send'); b.disabled = true; setStatus('Envoi…');
  const { error } = await sb.auth.signInWithOtp({ email:mail, options:{ emailRedirectTo: location.origin + location.pathname } });
  b.disabled = false;
  setStatus(error ? 'Envoi impossible : ' + error.message : 'Lien envoyé à ' + mail + '. Ouvrez-le sur cet appareil.');
}
async function signOut(){
  if (!confirm('Se déconnecter ? Le carnet reste sur cet appareil.')) return;
  await sync();
  await sb.auth.signOut();
}
function syncCardHTML(){
  if (!sb) return '<div class="card"><p class="mut">Synchronisation non configurée : renseignez <b>SUPABASE_URL</b> et <b>SUPABASE_KEY</b> en haut du script (voir <b>supabase/schema.sql</b>). En attendant, le carnet reste sur cet appareil.</p></div>';
  if (!session) return '<div class="card"><p class="mut" style="margin-bottom:12px">Retrouvez votre carnet sur tous vos appareils. Saisissez votre e-mail : vous recevrez un lien de connexion, sans mot de passe.</p>' +
    '<input class="field" id="s-mail" type="email" inputmode="email" autocomplete="email" aria-label="Adresse e-mail" placeholder="vous@exemple.fr">' +
    '<button type="button" class="btn" id="s-send" style="margin-top:8px">Recevoir le lien de connexion</button>' +
    '<p class="mut" id="sync-status" style="margin-top:10px">' + esc(syncStatus) + '</p></div>';
  return '<div class="card"><p style="font-size:15px">Connecté : <b>' + esc(session.user.email || '') + '</b></p>' +
    '<p class="mut" id="sync-status" style="margin:6px 0 12px">' + esc(syncStatus || (lastOk ? 'Dernière synchro à ' + hhmm(lastOk) : '')) + '</p>' +
    '<button type="button" class="btn" id="s-now">Synchroniser maintenant</button>' +
    '<button type="button" class="btn alt" id="s-out">Se déconnecter</button></div>';
}
function initSync(){
  if (!(SUPABASE_URL && SUPABASE_KEY) || typeof supabase === 'undefined') return;
  let fromLink = /access_token=/.test(location.hash);
  if (/error_description=/.test(location.hash)) setTimeout(() => alert('Lien de connexion invalide ou expiré. Demandez-en un nouveau.'), 300);
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
  sb.auth.onAuthStateChange((ev, s) => {
    const prev = session; session = s;
    setTimeout(() => {                                /* pas d'appel Supabase dans le callback lui-même */
      if (s) {
        if (!prev || prev.user.id !== s.user.id) bindUser();
        if (fromLink) { fromLink = false; state.tab = 'reglages'; openMain(); }
        sync();
      }
      if (!!prev !== !!s && state.tab === 'reglages' && !inDetail && !el('main').classList.contains('hidden')) render();
    }, 0);
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleSync(500); });
  window.addEventListener('online', () => scheduleSync(500));
}

renderCover();
initSync();
</script>
